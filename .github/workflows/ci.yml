name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: dbt parse (catches SQL/YAML errors fast)
        run: cd dbt && dbt parse --profiles-dir .
      - name: Tests (sample data, full pipeline + dbt build + dashboard)
        run: pytest -q
