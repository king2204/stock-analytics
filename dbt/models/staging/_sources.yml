version: 2

sources:
  - name: raw
    description: Landing tables written by pipelines/ingest.py (upserted, never transformed).
    schema: raw
    tables:
      - name: prices
        description: Daily OHLCV bars, one row per symbol and trading day.
        loaded_at_field: "cast(date as timestamp)"
        freshness:
          # Markets close on weekends and holidays, so allow a long weekend.
          warn_after: {count: 4, period: day}
          error_after: {count: 7, period: day}
      - name: corporate_actions
        description: Dividends (cash per share) and splits (new shares per old share).
      - name: tickers
        description: Ticker reference data synced from config/pipeline.toml.
      - name: transactions
        description: Trade ledger from data/portfolio_transactions.csv as entered (unadjusted).
